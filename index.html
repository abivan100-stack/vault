<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Vault is a cold-chain integrity console: it monitors a vaccine shipment's 2-8 degrees Celsius corridor, records every reading to a hash-chained ledger, and tracks the box from loading bay to handoff."
    />
    <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1110" media="(prefers-color-scheme: dark)" />
    <title>Vault &mdash; Cold-chain integrity console</title>
    <script>
      // Applies the stored theme before first paint. Without this the `dark`
      // class lands in a React effect, after the browser has already painted a
      // light background — a visible white flash for dark-mode users.
      (function () {
        try {
          var stored = window.localStorage.getItem("vault:theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var isDark = stored ? stored === "dark" : prefersDark;
          if (isDark) document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = isDark ? "dark" : "light";
        } catch (error) {
          // Storage blocked — fall through to the light default.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
